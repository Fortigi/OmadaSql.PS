name: Dependency Review

# Gates the dependency graph diff on every pull request: a published vulnerability advisory or a
# licence outside the allow-list fails the check before merge, instead of surfacing only as a
# Dependabot alert afterwards.
#
# Its own workflow rather than a job in pr-validation.yml: pr-validation.yml is issue_comment-driven
# (so github.ref always resolves to the default branch), while dependency-review-action needs a real
# pull_request event to diff base against head. The action reads the Dependency Review API rather
# than executing anything from the pull request branch, so it runs on every pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # The job `name` is what shows up as the check name. It has to read exactly "Dependency
    # Review": .github/rulesets/protect-main.json requires a check by that name.
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # `allow-licenses` is the supported replacement for the deprecated `deny-licenses`; the
          # two are mutually exclusive. Every licence in the dependency graph today:
          #   - MIT        - the GitHub actions used by the workflows, and
          #                  Microsoft.SqlServer.TransactSql.ScriptDom once it is bundled
          #   - Apache-2.0 - step-security/harden-runner
          allow-licenses: MIT, Apache-2.0
