# Dependabot keeps the pinned action versions used by the workflows in .github/workflows up to date.
# Every `uses:` is pinned to a commit SHA (Tests/Unit/WorkflowActionPins.Tests.ps1 enforces it), so
# without this nothing would ever move them.
#
# The nuget block covers Build/Dependencies, the manifest of the binaries the module bundles (the
# T-SQL parser). A Dependabot pull request there also needs ./Build/Update-DependencyLock.ps1, which
# re-pins the hashes; Tests/Unit/DependencyLock.Tests.ps1 fails until it has run.
#
# Dependabot pull requests are validated like any other: a maintainer comments /validate, and a
# maintainer merges.
#
# GitHub reads this file from the default branch only.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directory: "/Build/Dependencies"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
